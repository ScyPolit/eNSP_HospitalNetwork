#
sysname AGG-OFFICE
#
undo info-center enable
#
vlan batch 40 160 1105 1205
#
cluster enable
ntdp enable
ndp enable
#
drop illegal-mac alarm
#
dhcp enable
#
diffserv domain default
#
acl number 2001
 rule 5 permit source 10.162.120.20 0
 rule 10 deny
#
acl number 3040
 rule 5 permit udp source-port eq bootpc destination-port eq bootps
 rule 10 permit icmp destination 10.162.104.1 0
 rule 15 permit tcp destination 10.162.106.10 0 destination-port eq 443
 rule 20 permit icmp destination 10.162.106.10 0
 rule 25 permit tcp destination 10.162.108.10 0 destination-port eq www
 rule 30 deny ip destination 10.0.0.0 0.255.255.255
 rule 35 deny ip destination 172.16.0.0 0.15.255.255
 rule 40 deny ip destination 192.168.0.0 0.0.255.255
 rule 45 permit ip
acl number 3160
 rule 5 permit udp source-port eq bootpc destination-port eq bootps
 rule 10 permit icmp destination 10.162.120.1 0
 rule 15 permit ip source 10.162.120.20 0
 rule 20 permit ip destination 10.162.120.20 0
 rule 25 deny ip destination 10.0.0.0 0.255.255.255
 rule 35 deny ip destination 172.16.0.0 0.15.255.255
 rule 40 deny ip destination 192.168.0.0 0.0.255.255
 rule 45 permit ip
#
drop-profile default
#
aaa
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 domain default_admin
 local-user admin password simple admin
 local-user admin service-type http
#
interface Vlanif1
#
interface Vlanif40
 ip address 10.162.104.1 255.255.255.0
 dhcp select interface
 dhcp server excluded-ip-address 10.162.104.2 10.162.104.49
#
interface Vlanif160
 ip address 10.162.120.1 255.255.255.0
 dhcp select interface
 dhcp server excluded-ip-address 10.162.120.2 10.162.120.49
#
interface Vlanif1105
 ip address 10.162.99.114 255.255.255.252
#
interface Vlanif1205
 ip address 10.162.99.142 255.255.255.252
#
interface MEth0/0/1
#
interface Eth-Trunk1
 port link-type trunk
 port trunk allow-pass vlan 40
 mode lacp-static
#
interface Eth-Trunk2
 port link-type trunk
 port trunk allow-pass vlan 40
 mode lacp-static
#
interface Eth-Trunk3
 port link-type trunk
 port trunk allow-pass vlan 160
 mode lacp-static
#
interface GigabitEthernet0/0/1
 eth-trunk 1
#
interface GigabitEthernet0/0/2
 eth-trunk 1
#
interface GigabitEthernet0/0/3
 eth-trunk 2
#
interface GigabitEthernet0/0/4
 eth-trunk 2
#
interface GigabitEthernet0/0/5
 eth-trunk 3
#
interface GigabitEthernet0/0/6
 eth-trunk 3
#
interface GigabitEthernet0/0/7
#
interface GigabitEthernet0/0/8
#
interface GigabitEthernet0/0/9
#
interface GigabitEthernet0/0/10
#
interface GigabitEthernet0/0/11
#
interface GigabitEthernet0/0/12
#
interface GigabitEthernet0/0/13
#
interface GigabitEthernet0/0/14
#
interface GigabitEthernet0/0/15
#
interface GigabitEthernet0/0/16
#
interface GigabitEthernet0/0/17
#
interface GigabitEthernet0/0/18
#
interface GigabitEthernet0/0/19
#
interface GigabitEthernet0/0/20
#
interface GigabitEthernet0/0/21
#
interface GigabitEthernet0/0/22
#
interface GigabitEthernet0/0/23
 port link-type access
 port default vlan 1105
 stp disable
#
interface GigabitEthernet0/0/24
 port link-type access
 port default vlan 1205
 stp disable
#
interface NULL0
#
ospf 1 router-id 10.255.254.5
 silent-interface Vlanif40
 silent-interface Vlanif160
 area 0.0.0.0
  network 10.162.99.112 0.0.0.3
  network 10.162.99.140 0.0.0.3
 area 0.0.0.40
  network 10.162.104.0 0.0.0.255
  network 10.162.120.0 0.0.0.255
#
traffic-filter vlan 40 inbound acl 3040
traffic-filter vlan 160 inbound acl 3160
#
user-interface con 0
 screen-length 0
user-interface vty 0 4
 acl 2001 inbound
#
return
